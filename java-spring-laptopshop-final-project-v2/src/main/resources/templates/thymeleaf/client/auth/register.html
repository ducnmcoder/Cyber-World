<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cyber World</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyber-homepage.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            position: relative;
            margin: 0;
            padding: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background-image: url('/images/background_login_register.png');
            background-size: cover;
            background-position: center;
            filter: blur(5px);
            z-index: -1;
        }

        .auth-slogan {
            text-align: center;
            margin-top: auto;
            padding-top: 30px;
            color: #64748b;
            font-family: 'Inter', sans-serif;
        }
        .auth-slogan p {
            margin: 4px 0;
            font-size: 14px;
            font-style: italic;
            font-weight: 500;
        }

        .auth-container {
            max-width: 1000px;
            min-height: 650px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
        }

        .auth-image {
            flex: 1;
            display: none;
        }

        @media (min-width: 768px) {
            .auth-image {
                display: block;
            }
        }

        .auth-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-form-wrapper {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #cb1c22;
        }

        .form-group input.is-invalid {
            border-color: #c62828;
        }

        .invalid-feedback {
            color: #c62828;
            font-size: 13px;
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #cb1c22;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #a81519;
        }

        .auth-links {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .auth-links a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="main-container">
        <div class="auth-container">
            <div class="auth-image">
                <img th:src="@{/images/login_register_picture.jpg}" alt="Register Picture">
            </div>
            <div class="auth-form-wrapper">
                <div style="margin: auto 0; width: 100%;">
                    <h2>Create an Account</h2>

                <form method="post" th:action="@{/register}" th:object="${registerUser}">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" th:field="*{firstName}" placeholder="First Name"
                                th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                                th:errors="*{firstName}"></div>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" th:field="*{lastName}" placeholder="Last Name" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" th:field="*{email}" placeholder="example@gmail.com"
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" th:field="*{password}" placeholder="Create Password"
                                th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" required
                                pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                                title="The password must be at least 8 characters and include both letters and numbers." />
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password"
                                th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" required
                                pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                                title="The password must be at least 8 characters and include both letters and numbers." />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <button type="submit" class="btn-submit">Register</button>
                </form>

                <div class="auth-links">
                    <p>Already have an account? <a href="/login">Login now</a></p>
                </div>
            </div>

                <div class="auth-slogan">
                    <p>"Empower your digital life. Join Cyber World today."</p>
                    <p>"Your gateway to the ultimate tech experience."</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{thymeleaf/client/layout/footer :: footer}"></div>
</body>

</html>
