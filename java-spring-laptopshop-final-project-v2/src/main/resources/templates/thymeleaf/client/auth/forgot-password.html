<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cyber World</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cyber-homepage.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            position: relative;
            margin: 0;
            padding: 0;
        }
        body::before {
            content: '';
            position: fixed;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            background-image: url('/images/background_login_register.png');
            background-size: cover;
            background-position: center;
            filter: blur(5px);
            z-index: -1;
        }
        .auth-slogan {
            text-align: center;
            margin-top: auto;
            padding-top: 30px;
            color: #64748b;
            font-family: 'Inter', sans-serif;
        }
        .auth-slogan p {
            margin: 4px 0;
            font-size: 14px;
            font-style: italic;
            font-weight: 500;
        }
        .auth-container {
            max-width: 900px;
            min-height: 650px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            overflow: hidden;
        }
        .auth-image {
            flex: 1;
            display: none;
        }
        @media (min-width: 768px) {
            .auth-image {
                display: block;
            }
        }
        .auth-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .auth-form-wrapper {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #cd1818;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #cd1818;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #b51515;
        }
        .auth-links {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .auth-links a {
            color: #007bff;
            text-decoration: none;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
    </style>
</head>
<body>

    <header class="cyber-header" style="background-color: #cd1818; color: white; padding: 10px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 99999;">
        <div class="container" style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; padding: 0 15px;">
            <a th:href="@{/}" class="cyber-logo" style="text-decoration: none; display: flex; align-items: center;">
                <img th:src="@{/images/logo.png}" alt="Cyber World Logo" style="height: 50px; margin-right: 15px;">
                <div class="cyber-logo-text" style="display: flex; flex-direction: row; align-items: center; gap: 8px; justify-content: center;">
                    <span class="cyber-logo-title" style="font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; text-transform: uppercase; color: white;">CYBER</span>
                    <span class="cyber-logo-title" style="font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; text-transform: uppercase; color: white;">WORLD</span>
                </div>
            </a>
        </div>
    </header>
    
    <main class="main-container">
        <div class="auth-container">
            <div class="auth-image">
                <img th:src="@{/images/login_register_picture.jpg}" alt="Forgot Password Picture">
            </div>
            <div class="auth-form-wrapper">
                <div style="margin: auto 0; width: 100%;">
                    <h2>Forgot Password</h2>
                    <p style="text-align: center; color: #666; margin-bottom: 20px;">Enter your email address and we'll send you a verification code to reset your password.</p>
            
            <div th:if="${error}" class="alert alert-error" th:text="${error}">
                Error message
            </div>

            <form method="post" th:action="@{/forgot-password}">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="example@gmail.com" required>
                </div>
                
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button type="submit" class="btn-submit">Send Code</button>
            </form>

            <div class="auth-links">
                <p>Remember your password? <a href="/login">Back to Login</a></p>
            </div>
            </div>
            
            <div class="auth-slogan">
                <p>"Welcome back to the future of technology."</p>
                <p>"Experience seamless innovation with Cyber World."</p>
            </div>
            </div>
        </div>
    </main>

    <div th:replace="~{thymeleaf/client/layout/footer :: footer}"></div>
</body>
</html>
